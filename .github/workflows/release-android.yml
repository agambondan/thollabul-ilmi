name: Release Android App Bundle (AAB)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  build-and-release:
    name: Build & Release Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install Mobile Dependencies
        run: npm ci
        working-directory: ./apps/mobile

      - name: Run Mobile Unit Tests
        run: npm test -- --watchAll=false
        working-directory: ./apps/mobile

      - name: Decode Release Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/mobile/android/app/thollabul-ilmi-release.keystore

      - name: Build Release Bundle (AAB)
        run: ./gradlew bundleRelease --no-daemon
        working-directory: ./apps/mobile/android
        env:
          THOLLABUL_RELEASE_STORE_FILE: thollabul-ilmi-release.keystore
          THOLLABUL_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          THOLLABUL_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          THOLLABUL_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload to Google Play Console
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.thullaabulilmi.app
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
