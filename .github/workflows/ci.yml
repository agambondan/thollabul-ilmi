name: Thollabul Ilmi CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate-api:
    name: Validate API (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download dependencies
        run: go mod download
        working-directory: ./services/api

      - name: Build API
        run: go build ./...
        working-directory: ./services/api

      - name: Run tests
        run: go test ./...
        working-directory: ./services/api

  validate-web:
    name: Validate Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/web

      - name: Run lint
        run: npm run lint
        working-directory: ./apps/web

      - name: Run tests
        run: npm test
        working-directory: ./apps/web

      - name: Build
        run: npm run build
        working-directory: ./apps/web

  validate-links:
    name: Validate Blog Hadith/Quran Links
    runs-on: ubuntu-latest
    if: false  # Enable when DB accessible in CI
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install psycopg2-binary

      - name: Validate links
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python3 scripts/validate_blog_hadiths.py
