<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <!-- Outer background -->
  <rect width="192" height="192" rx="44" fill="#065f46"/>

  <!-- Decorative Islamic geometric accent -->
  <g opacity="0.10" stroke="#FBBF24" stroke-width="1" fill="none">
    <circle cx="96" cy="96" r="80"/>
    <circle cx="96" cy="96" r="62"/>
    <path d="M96 16 L96 176 M16 96 L176 96 M44 44 L148 148 M148 44 L44 148"/>
  </g>

  <!--
    Book mark — scaled down significantly (~0.68x) to prevent oversized appearance
    on Android / iOS launchers and within circular/squircle mask frames.
  -->
  <g transform="translate(96 102) scale(0.68)">
    <!-- Soft shadow -->
    <ellipse cx="0" cy="36" rx="42" ry="5" fill="#000" opacity="0.22"/>

    <!-- Open book body -->
    <path
      d="M-38 -22
         C-38 -22 -16 -32 0 -32
         C16 -32 38 -22 38 -22
         L38 28
         C38 28 16 18 0 18
         C-16 18 -38 28 -38 28
         Z"
      fill="#FFFFFF"
      fill-opacity="0.98"
    />

    <!-- Center spine -->
    <line x1="0" y1="-32" x2="0" y2="18" stroke="#065f46" stroke-width="3" stroke-linecap="round"/>

    <!-- Text lines — left page -->
    <path d="M-28 -16 C-22 -18 -12 -19 -3 -18.5" stroke="#065f46" stroke-width="2.2" stroke-linecap="round" opacity="0.35"/>
    <path d="M-28 -6  C-22 -8  -12 -9   -3 -8.5"  stroke="#065f46" stroke-width="2.2" stroke-linecap="round" opacity="0.35"/>
    <path d="M-28 4   C-22 2   -12 1    -3 1.5"   stroke="#065f46" stroke-width="2.2" stroke-linecap="round" opacity="0.35"/>

    <!-- Text lines — right page -->
    <path d="M28 -16 C22 -18 12 -19 3 -18.5" stroke="#065f46" stroke-width="2.2" stroke-linecap="round" opacity="0.35"/>
    <path d="M28 -6  C22 -8  12 -9   3 -8.5"  stroke="#065f46" stroke-width="2.2" stroke-linecap="round" opacity="0.35"/>
    <path d="M28 4   C22 2   12 1    3 1.5"   stroke="#065f46" stroke-width="2.2" stroke-linecap="round" opacity="0.35"/>

    <!-- Gold bookmark ribbon at center bottom -->
    <rect x="-6" y="18" width="12" height="18" rx="2" fill="#FBBF24"/>
    <polygon points="-6,36 0,30 6,36" fill="#065f46" opacity="0.45"/>

    <!-- Star above book -->
    <g transform="translate(0 -42)" fill="#FBBF24">
      <polygon points="0,-7 2,-2.2 7,-2.2 3,1.2 4.5,6.5 0,3.5 -4.5,6.5 -3,1.2 -7,-2.2 -2,-2.2"/>
    </g>
  </g>
</svg>
