<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: #065f46;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container {
      width: 512px;
      height: 512px;
      position: relative;
      background: linear-gradient(145deg, #047857 0%, #065f46 50%, #064e3b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pattern {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0.12;
      background-image: 
        radial-gradient(circle at 50% 50%, #fbbf24 1px, transparent 1px),
        radial-gradient(circle at 0% 0%, #fbbf24 1px, transparent 1px),
        radial-gradient(circle at 100% 100%, #fbbf24 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .sunburst {
      position: absolute;
      width: 440px;
      height: 440px;
      border: 1.5px solid rgba(251, 191, 36, 0.25);
      border-radius: 50%;
    }
    .sunburst-inner {
      position: absolute;
      width: 380px;
      height: 380px;
      border: 1px dashed rgba(251, 191, 36, 0.35);
      border-radius: 50%;
    }
    .svg-art {
      position: relative;
      z-index: 10;
      width: 320px;
      height: 320px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="pattern"></div>
    <div class="sunburst"></div>
    <div class="sunburst-inner"></div>
    <svg class="svg-art" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Decorative Islamic geometric accent -->
      <g opacity="0.25" stroke="#FBBF24" stroke-width="1.5" fill="none">
        <circle cx="96" cy="96" r="84"/>
        <circle cx="96" cy="96" r="66"/>
        <path d="M96 12 L96 180 M12 96 L180 96 M36 36 L156 156 M156 36 L36 156"/>
      </g>

      <g transform="translate(96 100) scale(0.92)">
        <!-- Soft shadow -->
        <ellipse cx="0" cy="38" rx="46" ry="6" fill="#000" opacity="0.35"/>

        <!-- Open book body -->
        <path
          d="M-40 -24
             C-40 -24 -18 -34 0 -34
             C18 -34 40 -24 40 -24
             L40 28
             C40 28 18 18 0 18
             C-18 18 -40 28 -40 28
             Z"
          fill="#FFFFFF"
        />

        <!-- Center spine -->
        <line x1="0" y1="-34" x2="0" y2="18" stroke="#065f46" stroke-width="3.5" stroke-linecap="round"/>

        <!-- Text lines — left page -->
        <path d="M-30 -16 C-24 -18 -14 -19 -3 -18.5" stroke="#065f46" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
        <path d="M-30 -6  C-24 -8  -14 -9   -3 -8.5"  stroke="#065f46" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
        <path d="M-30 4   C-24 2   -14 1    -3 1.5"   stroke="#065f46" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

        <!-- Text lines — right page -->
        <path d="M30 -16 C24 -18 14 -19 3 -18.5" stroke="#065f46" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
        <path d="M30 -6  C24 -8  14 -9   3 -8.5"  stroke="#065f46" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
        <path d="M30 4   C24 2   14 1    3 1.5"   stroke="#065f46" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

        <!-- Gold bookmark ribbon at center bottom -->
        <rect x="-7" y="18" width="14" height="20" rx="2" fill="#FBBF24"/>
        <polygon points="-7,38 0,31 7,38" fill="#065f46" opacity="0.5"/>

        <!-- 8-pointed star above book -->
        <g transform="translate(0 -48) scale(1.3)" fill="#FBBF24">
          <polygon points="0,-10 2.5,-3 10,-3 4,1.5 6,9 0,4.5 -6,9 -4,1.5 -10,-3 -2.5,-3"/>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
