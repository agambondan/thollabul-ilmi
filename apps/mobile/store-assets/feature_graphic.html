<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background: linear-gradient(135deg, #064e3b 0%, #065f46 50%, #047857 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container {
      width: 1024px;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 50px 70px;
      position: relative;
    }
    .pattern {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0.12;
      background-image: 
        radial-gradient(circle at 50% 50%, #fbbf24 1.5px, transparent 1.5px),
        radial-gradient(circle at 0% 0%, #fbbf24 1.5px, transparent 1.5px),
        radial-gradient(circle at 100% 100%, #fbbf24 1.5px, transparent 1.5px);
      background-size: 32px 32px;
    }
    .left {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
      z-index: 2;
    }
    .right {
      flex: 0.8;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .brand {
      color: #fbbf24;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(251, 191, 36, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(251, 191, 36, 0.35);
    }
    h1 {
      color: #ffffff;
      font-size: 46px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }
    h1 span {
      color: #fbbf24;
    }
    .tagline {
      color: rgba(255, 255, 255, 0.92);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.4;
    }
    .badges {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .badge {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }
    .book-svg {
      width: 290px;
      height: 290px;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.45));
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="pattern"></div>
    <div class="left">
      <div class="brand">Aplikasi Penuntut Ilmu</div>
      <h1>Thullaabul <span>Ilmi</span></h1>
      <p class="tagline">Al-Qur'an · Hadits · Jadwal Sholat · Arah Kiblat · Belajar</p>
      <div class="badges">
        <span class="badge">📖 Al-Qur'an & Terjemah</span>
        <span class="badge">📚 Hadits Shahih</span>
        <span class="badge">🕌 Jadwal Sholat & Adzan</span>
        <span class="badge">🧭 Arah Kiblat Presisi</span>
      </div>
    </div>
    <div class="right">
      <svg class="book-svg" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Decorative Islamic geometric accent -->
        <g opacity="0.25" stroke="#FBBF24" stroke-width="1.5" fill="none">
          <circle cx="96" cy="96" r="84"/>
          <circle cx="96" cy="96" r="66"/>
          <path d="M96 12 L96 180 M12 96 L180 96 M36 36 L156 156 M156 36 L36 156"/>
        </g>

        <g transform="translate(96 100) scale(0.92)">
          <!-- Soft shadow -->
          <ellipse cx="0" cy="38" rx="46" ry="6" fill="#000" opacity="0.35"/>

          <!-- Open book body -->
          <path
            d="M-40 -24
               C-40 -24 -18 -34 0 -34
               C18 -34 40 -24 40 -24
               L40 28
               C40 28 18 18 0 18
               C-18 18 -40 28 -40 28
               Z"
            fill="#FFFFFF"
          />

          <!-- Center spine -->
          <line x1="0" y1="-34" x2="0" y2="18" stroke="#065f46" stroke-width="3.5" stroke-linecap="round"/>

          <!-- Text lines — left page -->
          <path d="M-30 -16 C-24 -18 -14 -19 -3 -18.5" stroke="#065f46" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
          <path d="M-30 -6  C-24 -8  -14 -9   -3 -8.5"  stroke="#065f46" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
          <path d="M-30 4   C-24 2   -14 1    -3 1.5"   stroke="#065f46" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

          <!-- Text lines — right page -->
          <path d="M30 -16 C24 -18 14 -19 3 -18.5" stroke="#065f46" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
          <path d="M30 -6  C24 -8  14 -9   3 -8.5"  stroke="#065f46" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
          <path d="M30 4   C24 2   14 1    3 1.5"   stroke="#065f46" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

          <!-- Gold bookmark ribbon at center bottom -->
          <rect x="-7" y="18" width="14" height="20" rx="2" fill="#FBBF24"/>
          <polygon points="-7,38 0,31 7,38" fill="#065f46" opacity="0.5"/>

          <!-- Star above book -->
          <g transform="translate(0 -48) scale(1.3)" fill="#FBBF24">
            <polygon points="0,-10 2.5,-3 10,-3 4,1.5 6,9 0,4.5 -6,9 -4,1.5 -10,-3 -2.5,-3"/>
          </g>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
