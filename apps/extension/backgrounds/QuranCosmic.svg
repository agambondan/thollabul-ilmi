<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="sky" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="60%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
   </radialGradient>
    <pattern id="stars" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="30" r="1" fill="#fff" opacity="0.9"/>
      <circle cx="60" cy="70" r="1.5" fill="#fff" opacity="1"/>
      <circle cx="85" cy="20" r="0.8" fill="#fff" opacity="0.7"/>
      <circle cx="40" cy="80" r="1" fill="#fff" opacity="0.8"/>
   </pattern>
 </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#stars)"/>

  <!-- Subtle nebula -->
  <ellipse cx="960" cy="540" rx="900" ry="300" fill="#F59E0B" opacity="0.04"/>
  <ellipse cx="700" cy="600" rx="600" ry="200" fill="#A78BFA" opacity="0.05"/>

  <!-- Quran on Stand silhouette -->
  <g transform="translate(0,0)">
    <!-- Center round display area for calligraphy -->
    <circle cx="960" cy="540" r="340" fill="rgba(255,255,255,0.04)" stroke="rgba(251,191,36,0.3)" stroke-width="2"/>
    <circle cx="960" cy="540" r="300" fill="none" stroke="rgba(251,191,36,0.2)" stroke-width="1" stroke-dasharray="6,8"/>
    
    <!-- Quran stand -->
    <g fill="#0F0E2C" opacity="0.8">
      <!-- Rehal base -->
      <rect x="820" y="820" width="280" height="20" rx="6"/>
      <rect x="900" y="840" width="120" height="50"/>
      <rect x="820" y="890" width="280" height="12" rx="4"/>
      
      <!-- Book page -->
      <path d="M 820 820 L 820 700 L 1100 700 L 1100 820 Z" fill="#1E1B4B" stroke="rgba(251,191,36,0.3)" stroke-width="2"/>
      <line x1="820" y1="710" x2="1100" y2="710" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
      <line x1="820" y1="725" x2="1100" y2="725" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
      <line x1="820" y1="740" x2="1100" y2="740" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
   </g>
 </g>

  <!-- Glowing Arabic word (stylized) -->
  <g transform="translate(960, 540)" opacity="0.7">
    <text text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="100" font-weight="bold" fill="#FBBF24" filter="url(#glow)">﷽</text>
 </g>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
     </feMerge>
   </filter>
 </defs>
</svg>
