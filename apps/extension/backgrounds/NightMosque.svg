<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#021B1A"/>
      <stop offset="60%" stop-color="#053F38"/>
      <stop offset="100%" stop-color="#0A5C50"/>
    </linearGradient>
    <pattern id="islamic-geo" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 0 L60 30 L30 60 L0 30 Z" fill="none" stroke="rgba(167,243,208,0.06)" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="14" fill="none" stroke="rgba(251,191,36,0.08)" stroke-width="1"/>
      <path d="M0 0 L30 30 L0 60 M60 0 L30 30 L60 60" fill="none" stroke="rgba(167,243,208,0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="lantern-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#islamic-geo)"/>

  <!-- Stars -->
  <circle cx="200" cy="180" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="450" cy="120" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="850" cy="220" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="1200" cy="90" r="2.2" fill="#fff" opacity="0.9"/>
  <circle cx="1500" cy="160" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="1750" cy="250" r="1.8" fill="#fff" opacity="0.8"/>
  <circle cx="1350" cy="310" r="1.2" fill="#fff" opacity="0.5"/>

  <!-- Glowing Crescent Moon -->
  <g transform="translate(1550, 160)">
    <circle cx="0" cy="0" r="85" fill="none"/>
    <path d="M 0 -70 A 70 70 0 1 0 70 0 A 60 60 0 1 1 0 -70 Z" fill="#FEF3C7" filter="drop-shadow(0 0 25px rgba(253, 230, 138, 0.6))"/>
  </g>

  <!-- Mosque Silhouette -->
  <g fill="#011615" opacity="0.95">
    <!-- Base Ground -->
    <rect y="920" width="1920" height="160"/>
    
    <!-- Large Center Dome -->
    <path d="M 800 920 C 800 680 1120 680 1120 920 Z"/>
    <path d="M 960 660 L 960 620 M 952 630 L 968 630" stroke="#011615" stroke-width="4"/>
    <circle cx="960" cy="615" r="5" fill="#011615"/>

    <!-- Left Small Dome -->
    <path d="M 520 920 C 520 760 740 760 740 920 Z"/>
    
    <!-- Right Small Dome -->
    <path d="M 1180 920 C 1180 760 1400 760 1400 920 Z"/>

    <!-- Left Minaret -->
    <rect x="360" y="420" width="45" height="500"/>
    <path d="M 350 420 L 415 420 L 382.5 350 Z"/>
    <rect x="350" y="580" width="65" height="15" rx="3"/>
    <rect x="350" y="720" width="65" height="15" rx="3"/>

    <!-- Right Minaret -->
    <rect x="1515" y="420" width="45" height="500"/>
    <path d="M 1505 420 L 1570 420 L 1537.5 350 Z"/>
    <rect x="1505" y="580" width="65" height="15" rx="3"/>
    <rect x="1505" y="720" width="65" height="15" rx="3"/>
  </g>
</svg>
