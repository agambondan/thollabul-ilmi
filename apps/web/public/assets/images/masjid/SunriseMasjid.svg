<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="sunrise" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#3F1A0A"/>
    </linearGradient>
    <pattern id="arches" width="120" height="200" patternUnits="userSpaceOnUse">
      <path d="M 0 200 L 0 60 Q 60 -20 120 60 L 120 200 Z" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#sunrise)"/>
  
  <!-- Atmospheric haze -->
  <rect width="1920" height="1080" fill="url(#arches)" opacity="0.6"/>

  <!-- Rising Sun -->
  <circle cx="960" cy="780" r="220" fill="url(#sun)"/>
  <circle cx="960" cy="780" r="120" fill="#FEF3C7" opacity="0.95"/>

  <!-- Sun rays -->
  <g stroke="#FEF3C7" stroke-width="2" opacity="0.4">
    <line x1="960" y1="500" x2="960" y2="450"/>
    <line x1="780" y1="640" x2="740" y2="610"/>
    <line x1="1140" y1="640" x2="1180" y2="610"/>
    <line x1="700" y1="780" x2="640" y2="780"/>
    <line x1="1220" y1="780" x2="1280" y2="780"/>
  </g>

  <!-- Mosque Silhouette (sunrise) -->
  <g fill="#2D1810" opacity="0.95">
    <rect y="900" width="1920" height="180"/>

    <!-- Center Big Dome -->
    <path d="M 770 900 C 770 620 1150 620 1150 900 Z"/>
    <path d="M 960 600 L 960 560" stroke="#2D1810" stroke-width="6"/>
    <circle cx="960" cy="552" r="8" fill="#2D1810"/>
    <path d="M 940 560 L 980 560" stroke="#2D1810" stroke-width="3"/>

    <!-- Side Smaller Domes -->
    <path d="M 460 900 C 460 700 660 700 660 900 Z"/>
    <path d="M 1260 900 C 1260 700 1460 700 1460 900 Z"/>

    <!-- Tall Minarets -->
    <rect x="320" y="280" width="50" height="620"/>
    <path d="M 305 280 L 385 280 L 345 200 Z"/>
    <rect x="305" y="450" width="80" height="18" rx="4"/>
    <rect x="305" y="620" width="80" height="18" rx="4"/>

    <rect x="1550" y="280" width="50" height="620"/>
    <path d="M 1535 280 L 1615 280 L 1575 200 Z"/>
    <rect x="1535" y="450" width="80" height="18" rx="4"/>
    <rect x="1535" y="620" width="80" height="18" rx="4"/>
  </g>

  <!-- Birds -->
  <g fill="none" stroke="#2D1810" stroke-width="2" opacity="0.6">
    <path d="M 350 200 q 12 -8 24 0 q 12 -8 24 0"/>
    <path d="M 500 150 q 10 -6 20 0 q 10 -6 20 0"/>
    <path d="M 1450 250 q 12 -8 24 0 q 12 -8 24 0"/>
  </g>
</svg>
