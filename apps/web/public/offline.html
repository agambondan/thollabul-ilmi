<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Offline — Thullaabul 'Ilmi</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1.5rem;
                background: #fdfaf3;
                color: #064e3b;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
                text-align: center;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background: #0f172a;
                    color: #d1fae5;
                }
                p {
                    color: #94a3b8 !important;
                }
            }
            h1 {
                font-size: 1.25rem;
                margin: 0.75rem 0;
            }
            p {
                font-size: 0.9rem;
                line-height: 1.65;
                color: #475569;
                max-width: 28rem;
                margin: 0 auto;
            }
            button {
                margin-top: 1.75rem;
                padding: 0.55rem 1.35rem;
                border: none;
                border-radius: 9999px;
                background: #047857;
                color: #fff;
                font-size: 0.875rem;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div>
            <p style="font-size: 2.5rem; margin: 0">📶</p>
            <h1>Sedang offline · You are offline</h1>
            <p>
                Halaman ini belum tersimpan untuk dibaca offline. Halaman yang
                pernah kamu buka tetap bisa diakses.
                <br /><br />
                This page has not been saved for offline reading. Pages you have
                opened before are still available.
            </p>
            <button type="button" onclick="location.reload()">
                Muat ulang · Reload
            </button>
        </div>
    </body>
</html>
